name: Annonces forum vers Discord

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier le forum et prévenir Discord
        env:
          DISCORD_WEBHOOK_FICHES: ${{ secrets.DISCORD_WEBHOOK_FICHES }}
        run: python3 notify.py
      - name: Sauvegarder l'état
        if: always()
        run: |
          git config user.name "forum-bot"
          git config user.email "forum-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "maj état" && git pull --rebase -q && git push)
